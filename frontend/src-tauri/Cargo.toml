[package]
name = "hermes"
version = "1.0.1"
description = "HERMES — application desktop locale de veille et réponse aux appels d'offre."
edition = "2021"
rust-version = "1.77"

[lib]
name = "hermes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Job Object Windows « kill-on-close » : les enfants (backend, Ollama) meurent avec hermes.exe.
[target.'cfg(windows)'.dependencies]
win32job = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
