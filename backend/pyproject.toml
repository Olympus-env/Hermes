[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-backend"
version = "1.0.1"
description = "Backend FastAPI de l'application HERMES (veille AO locale)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008 : `Depends()`/`Query()` en défaut d'argument est l'idiome FastAPI
# canonique, pas un bug — faux positif systématique sur nos routes.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# models.py évite volontairement `from __future__ import annotations` et garde
# `Optional`/`List` (typing) + `(str, Enum)` : SQLModel/SQLAlchemy introspectent
# les annotations à l'exécution et ont besoin des types réels (cf. CLAUDE.md).
"hermes/db/models.py" = ["UP006", "UP007", "UP017", "UP035", "UP042", "UP045"]
